name: Project18 - GitOps Infra Deployment
run-name: Project18 - GitOps Infra Deployment (${{ github.event.head_commit.message || 'manual run' }})
on:
  push:
    branches: [main]
    paths: ['project18/**']
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project18
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: terraform plan -out=tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: project18/tfplan

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: project18
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: project18
      - run: terraform init
      - run: terraform apply -auto-approve tfplan
